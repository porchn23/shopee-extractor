<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Shopee Product Extractor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 340px;
      padding: 12px;
      background: #fff;
    }
    h3 {
      margin: 0 0 10px 0;
      color: #ee4d2d;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #ee4d2d;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover { background: #d73211; }
    button.secondary {
      background: #555;
    }
    button.secondary:hover { background: #333; }
    #result {
      margin-top: 10px;
      font-size: 12px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row { margin-bottom: 4px; }
    .label { font-weight: bold; color: #333; }
    #status { font-size: 11px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <h3>🛒 Shopee Extractor</h3>

  <div style="border-bottom:1px solid #eee; padding-bottom:8px; margin-bottom:10px;">
    <div style="font-size:11px; font-weight:bold; color:#555; margin-bottom:4px;">⚙️ ตั้งค่า Google Sheet (ทำครั้งเดียว)</div>
    <input id="sheetUrlInput" type="text" placeholder="วาง Web app URL จาก Apps Script ที่นี่"
      style="width:100%; box-sizing:border-box; padding:6px; font-size:11px; border:1px solid #ccc; border-radius:4px; margin-bottom:4px;" />
    <button id="saveSheetUrlBtn" class="secondary" style="padding:6px;">บันทึก URL</button>
  </div>

  <div style="border-bottom:1px solid #eee; padding-bottom:8px; margin-bottom:10px;">
    <div style="font-size:11px; font-weight:bold; color:#555; margin-bottom:4px;">🎯 ตั้งค่ารายละเอียด/รีวิว (ทำครั้งแรกครั้งเดียว)</div>
    <button id="pickReviewBtn" class="secondary" style="padding:6px; font-size:12px;">เลือกส่วนรีวิว (คลิกในหน้าเว็บ)</button>
    <button id="pickDescBtn" class="secondary" style="padding:6px; font-size:12px;">เลือกส่วนรายละเอียดสินค้า</button>
    <div id="pickerStatus" style="font-size:11px; color:#888; margin-top:4px;"></div>
  </div>

  <div style="border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px;">
    <div style="font-size:12px; font-weight:bold; color:#555; margin-bottom:6px;">หน้าสินค้าเดี่ยว</div>
    <button id="extractBtn">อ่านข้อมูลสินค้าจากหน้านี้</button>
    <div style="font-size:11px; color:#555; margin:6px 0 3px;">ลิงก์ Affiliate (แปลงจากแอป Shopee เองก่อน แล้ววางที่นี่):</div>
    <input id="affiliateUrlInput" type="text" placeholder="เช่น https://s.shopee.co.th/xxxxx"
      style="width:100%; box-sizing:border-box; padding:6px; font-size:11px; border:1px solid #ccc; border-radius:4px; margin-bottom:6px;" />
    <button id="copyBtn" class="secondary" disabled>คัดลอกเป็นข้อความ</button>
    <button id="sendSheetBtn" disabled>📤 ส่งไปที่ Google Sheet</button>
  </div>

  <div>
    <div style="font-size:12px; font-weight:bold; color:#555; margin-bottom:6px;">หน้าค้นหา/รายการสินค้า (ดึงหลายตัวพร้อมกัน)</div>
    <button id="extractListBtn">อ่านสินค้าทั้งหมดในหน้านี้</button>
    <button id="copyListBtn" class="secondary" disabled>คัดลอกเป็นตาราง CSV</button>
    <button id="sendListSheetBtn" disabled>📤 ส่งทั้งหมดไปที่ Google Sheet</button>
  </div>

  <div id="result">เปิดหน้าสินค้า หรือหน้าค้นหา Shopee แล้วเลือกปุ่มด้านบน</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
